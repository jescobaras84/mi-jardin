:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}

header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}

.btn.ghost{background:var(--leafbg);color:var(--leaf)}

.btn.block{width:100%}
.btn:disabled{opacity:.5}

.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.stat b{font-size:20px;display:block;font-family:Fraunces,serif}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}

.pcard b{font-weight:600}

.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block;width:max-content}

.spark{display:block;width:100%;height:56px}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:#e9e5d8}

.i-rem{background:#fde8ef} .i-nota{background:#eee}
.big-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}

.diary{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.diary:last-child{border:0}

 .alert{background:#fff8f5;border:1px solid #e8b9a9;border-radius:14px;padding:12px;margin-bottom:8px}
.alert .head{display:flex;gap:12px;align-items:center;width:100%;text-align:left}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.cmp figcaption{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 14px}
.tl-i:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--dot,#9aa494);border:2px solid var(--card)}
.tl-i .rowx{display:flex;gap:10px}
.tl-i img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.dots i{width:14px;height:14px;border-radius:4px;display:block}
.trend{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.t-mejor{background:var(--leafbg);color:var(--leaf)} .t-igual{background:#ece8db;color:#5d5a4e} .t-peor{background:var(--rustbg);color:var(--rust)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#1f2a1f;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;animation:tin .25s ease}
.toast button{color:#9fd8a8;font-weight:600;padding:6px 8px;flex:none}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
.when{font-size:12px;font-weight:600;color:var(--muted);background:#ece8db;border-radius:99px;padding:6px 10px;flex:none}
.prio{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-right:4px;vertical-align:1px}
.p1{background:var(--rustbg);color:var(--rust)} .p2{background:var(--sunbg);color:#8a6110}
.i-trat{background:var(--rustbg)} .i-control{background:#e7e2f5} .i-inspeccion{background:#e6eef7}
.bar{height:8px;border-radius:99px;background:#ece8db;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--leaf2);border-radius:99px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.step:last-child{border:0}
.step .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;background:#fff}
.step.done{color:var(--muted);text-decoration:line-through}
.step.done .ck{background:var(--leaf);border-color:var(--leaf);color:#fff}
.season{background:#eef3fa;border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:14px;color:#244a68}
.season ul{padding-left:18px;margin-top:6px}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--sunbg);color:#7a560e;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tip{background:var(--leafbg);border-radius:14px;padding:12px 14px;font-size:14px;color:#24502c}
</style>

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var p=(s||today()).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((parse(a)-parse(b))/86400000);}
function nice(s){var n=diff(s,today());if(n===0)return "hoy";if(n===-1)return "ayer";if(n===1)return "mañana";if(n<0)return "hace "+(-n)+" días";if(n<7)return "en "+n+" días";return parse(s).toLocaleDateString("es",{day:"numeric",month:"short"});}
function short(s){return parse(s).toLocaleDateString("es",{day:"numeric",month:"short"});}
function uid(){return Math.random().toString(36).slice(2,9);}
function plant(id){for(var i=0;i<S.plants.length;i++)if(S.plants[i].id===id)return S.plants[i];return null;}
function plantLog(id){return S.log.filter(function(l){return l.plantId===id;}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(b.t||0)-(a.t||0);});}
function lastOf(id,kind){var l=plantLog(id).filter(function(x){return x.kind===kind;});return l[0]||null;}

/* tareas de cada planta */
function tasksFor(p){
  var out=[];
  if(p.type==="hidro"){
    var lm=lastOf(p.id,"medicion"), ls=lastOf(p.id,"solucion");
    out.push({kind:"medicion",label:"Medir pH y EC",due:addDays(lm?lm.d:p.created,p.check||3)});
    out.push({kind:"solucion",label:"Cambiar solución nutritiva",due:addDays(ls?ls.d:(p.lastSol||p.created),p.sol||14)});
  }else{
    var la=lastOf(p.id,"agua"), lf=lastOf(p.id,"abono");
    out.push({kind:"agua",label:"Regar",due:addDays(la?la.d:(p.lastWater||p.created),p.water||3)});
    out.push({kind:"abono",label:"Abonar",due:addDays(lf?lf.d:(p.lastFeed||p.created),p.feed||21)});
  }
  (p.reminders||[]).forEach(function(r){
    var l=plantLog(p.id).filter(function(x){return x.kind==="rem"&&x.remId===r.id;})[0];
    out.push({kind:"rem",remId:r.id,icon:r.icon||"🔔",label:r.label,due:addDays(l?l.d:(r.start||p.created),r.every)});
  });
  var tr=p.treatment;
  if(tr&&tr.active){
    tr.steps.forEach(function(st){if(!st.done)out.push({kind:"trat",stepId:st.id,icon:st.icon||"💊",label:st.action,due:addDays(tr.start,st.day),sev:tr.sev,prio:tr.priority});});
    var lph=photosOf(p).slice(-1)[0],base=lph&&lph.d>tr.start?lph.d:tr.start;
    out.push({kind:"control",icon:"📸",label:"Foto de control",due:addDays(base,tr.followup||5),sev:tr.sev,prio:tr.priority});
  }else{
    var li=plantLog(p.id).filter(function(l){return l.kind==="inspeccion"||l.kind==="foto"||l.kind==="salud";})[0];
    out.push({kind:"inspeccion",icon:"🔍",label:"Inspección preventiva",due:addDays(li?li.d:(p.created||today()),7)});
  }
  out.forEach(function(t){t.p=p;t.days=diff(t.due,today());});
  return out;
}
function prioOf(t){
  if(t.kind==="trat"||t.kind==="control")return (t.prio==="alta"||t.sev==="grave")?1:2;
  if((t.kind==="agua"||t.kind==="solucion")&&t.days<=-2)return 2;
  if(t.kind==="inspeccion")return 4;
  return 3;
}
function allTasks(){var a=[];S.plants.forEach(function(p){a=a.concat(tasksFor(p));});a.forEach(function(t){t.pr=prioOf(t);});return a.sort(function(x,y){return (x.days<=0&&y.days<=0)?(x.pr-y.pr||x.days-y.days):x.days-y.days;});}
function readingAlert(p){
  if(p.type!=="hidro")return null;
  var m=lastOf(p.id,"medicion"); if(!m)return null;
  var bad=[];
  if(m.ph!=null&&m.ph!==""){ if(m.ph<p.phMin)bad.push("pH bajo ("+m.ph+")"); if(m.ph>p.phMax)bad.push("pH alto ("+m.ph+")"); }
  if(m.ec!=null&&m.ec!==""){ if(m.ec<p.ecMin)bad.push("EC baja ("+m.ec+")"); if(m.ec>p.ecMax)bad.push("EC alta ("+m.ec+")"); }
  if(m.temp!=null&&m.temp!==""&&m.temp>24)bad.push("agua caliente ("+m.temp+" °C)");
  return bad.length?bad:null;
}
function lastHealth(p){
  return plantLog(p.id).filter(function(l){return (l.kind==="salud"||l.kind==="foto")&&l.sev;})[0]||null;
}
function healthOf(p){
  var h=lastHealth(p);
  if(h&&diff(today(),h.d)<=30&&h.sev!=="sana")return h;
  return null;
}
var SEVCOL={sana:"#4f9a5c",atencion:"#e0a526",grave:"#b5482e"};
function timeline(p){
  var t=plantLog(p.id).filter(function(l){return (l.kind==="foto"||l.kind==="salud"||(l.kind==="nota"&&l.thumb));});
  var hasFirst=t.some(function(l){return l.first;});
  if(p.thumb&&!hasFirst&&!t.some(function(l){return l.thumb===p.thumb;}))t.push({id:"_ini",d:p.created||today(),t:0,kind:"foto",thumb:p.thumb,title:"Foto inicial",first:true});
  return t.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.t||0)-(b.t||0);});
}
function photosOf(p){return timeline(p).filter(function(l){return l.thumb;});}
var ICON={agua:"💧",abono:"🧪",medicion:"📏",solucion:"🔄",salud:"🩺",nota:"📝",rem:"🔔",inspeccion:"🔍",foto:"📸"};
var KINDNAME={agua:"Riego",abono:"Abono",medicion:"Medición",solucion:"Cambio de solución",salud:"Revisión de salud",nota:"Nota",rem:"Recordatorio",inspeccion:"Inspección preventiva",foto:"Foto de seguimiento"};

/* ---------- guardar ---------- */
function save(){
  S.v=(S.v||0)+1;
  if(!window.MJStore){showToast("⚠️ No se pudo guardar: falta el almacenamiento local.",null,8000);render();return;}
  MJStore.save(S).catch(function(e){showToast("⚠️ No se pudo guardar este cambio ("+((e&&e.message)||"error")+"). Exporta un respaldo en Ajustes.",null,9000);render();});
  if(window.MJSync)MJSync.changed();
}
var softT=null;
function softRender(){var ae=document.activeElement;if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&ae.type!=="file"){clearTimeout(softT);softT=setTimeout(softRender,1500);return;}render();}
function syncInfo(){return window.MJSync?MJSync.info():{status:"off"};}
function cloudPill(){
  var i=syncInfo();
  if(i.status==="off")return "";
  var m={out:["☁️","Sin cuenta"],syncing:["⏳","Sincronizando"],ok:["☁️✓","En la nube"],error:["⚠️","Error al sincronizar"],offline:["📴","Sin conexión"]}[i.status]||["☁️",""];
  return '<button data-a="ajustes" class="pill" style="background:'+(i.status==="error"?"var(--rustbg);color:var(--rust)":i.status==="out"?"var(--sunbg);color:#8a6110":"var(--leafbg)")+'" aria-label="'+m[1]+'">'+m[0]+'</button>';
}
function setSaving(on){var el=document.getElementById("saving");if(el)el.className="pill saving"+(on?" on":"");}
function buildDoc(){
  var head='\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Mi Jardín</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">\n';
  var css=document.getElementById("app-css").textContent;
  var js=document.getElementById("app-js").textContent;
  var data=JSON.stringify(S).replace(/</g,"\\u003c");
  var SC="script";
  return "<!DOCTYPE html>\n<html lang=\"es\">\n<head>"+head+"<style id=\"app-css\">"+css+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<"+SC+" id=\"state\" type=\"application/json\">"+data+"</"+SC+">\n<"+SC+" id=\"app-js\">"+js+"</"+SC+">\n</body>\n</html>";
}
function publish(){
  if(!ART)return;
  ART.publish(buildDoc()).catch(function(e){
    setSaving(false);
    if(e&&(e.code==="not_granted"||e.code==="not_writer")){ART=null;render();}
  });
}

/* ---------- acciones ---------- */
var toastTimer=null;
function showToast(msg,undo,ms){
  ms=ms||6000;ui.toast={msg:msg,undo:undo||null,until:Date.now()+ms};
  try{sessionStorage.setItem("miJardin.toast",JSON.stringify(ui.toast));}catch(e){}
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){ui.toast=null;try{sessionStorage.removeItem("miJardin.toast");}catch(e){}render();},ms);
}
function addLog(entry){entry.id=uid();entry.t=Date.now();entry.d=entry.d||today();S.log.push(entry);}
function doTask(pid,kind,remId){
  if(kind==="medicion"){openSheet({k:"medir",pid:pid});return;}
  if(kind==="trat"){
    var pt=plant(pid),tr=pt&&pt.treatment;if(!tr)return;
    var st=tr.steps.filter(function(x){return x.id===remId;})[0];if(!st)return;
    st.done=!st.done;st.doneOn=st.done?today():null;
    if(st.done)addLog({plantId:pid,kind:"nota",text:"Tratamiento: "+st.action});
    var left=tr.steps.filter(function(x){return !x.done;}).length;
    showToast(st.done?(left?"✅ Paso hecho. Quedan "+left+".":"🎉 Terminaste todos los pasos. Toma una foto de control para confirmar que mejoró."):"Paso marcado como pendiente.");
    save();render();return;
  }
  var dup=S.log.filter(function(l){return l.plantId===pid&&l.kind===kind&&(l.remId||null)===(remId||null)&&l.d===today();})[0];
  if(dup){var p0=plant(pid),n0=tasksFor(p0).filter(function(t){return t.kind===kind&&(t.remId||null)===(remId||null);})[0];showToast("👍 Ya estaba anotado hoy. Próximo: "+(n0?nice(n0.due):"—")+".");render();return;}
  var e={plantId:pid,kind:kind}; if(remId)e.remId=remId;
  addLog(e);
  var p=plant(pid),nt=tasksFor(p).filter(function(t){return t.kind===kind&&(t.remId||null)===(remId||null);})[0];
  var what={agua:"Riego",abono:"Abono",solucion:"Cambio de solución",inspeccion:"Inspección",rem:nt?nt.label:"Tarea"}[kind]||"Tarea";
  showToast("✅ "+what+" de "+p.name+" anotado. Próximo: "+(nt?nice(nt.due):"—")+".",e.id);
  save();render();
}

/* ---------- render ---------- */

  var r=document.getElementById("root");
  var h='<span id="saving" class="pill saving">Guardando…</span><div class="wrap">';
  h+='<header class="top"><div><h1>Mi Jardín</h1><div class="date">'+new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})+'</div></div><div style="display:flex;gap:8px;align-items:center">'+cloudPill()+'<span class="pill">🌿 '+S.plants.length+'</span><button data-a="ajustes" aria-label="Ajustes" style="font-size:22px;padding:4px">⚙️</button></div></header>';
  if(false)h+='<div class="banner">Los cambios se guardan solo en este teléfono. Abre la app desde tu enlace de Claude para que se guarden en la nube.</div>';
  if(!ui.loading&&syncInfo().status==="out")h+='<button class="banner" data-a="ajustes" style="display:block;width:100%;text-align:left;border:0">☁️ <b>Guarda tu jardín en la nube.</b> Entra con tu correo para no perder nada si cambias de teléfono y compartirlo con tu familia. <u>Entrar</u></button>';
  if(ui.loading)h+='<div class="empty"><div class="big"><span class="spin">🌿</span></div><p>Cargando tu jardín…</p></div>';
  else if(ui.tab==="hoy")h+=viewHoy();
  else if(ui.tab==="plantas")h+=viewPlantas();
  else if(ui.tab==="hidro")h+=viewHidro();
  else if(ui.tab==="salud")h+=viewSalud();
  h+='</div>';
  if(ui.tab==="plantas"||ui.tab==="hoy")h+='<button class="fab" data-a="new" aria-label="Agregar planta">+</button>';
  h+='<nav class="tabs">'+[["hoy","☀️","Hoy"],["plantas","🪴","Plantas"],["hidro","💧","Hidro"],["salud","🩺","Salud"]].map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'"><span class="e">'+t[1]+'</span>'+t[2]+'</button>';}).join("")+'</nav>';
  if(ui.sheet)h+=viewSheet();
  if(ui.toast)h+='<div class="toast" role="status"><span style="flex:1">'+esc(ui.toast.msg)+'</span>'+(ui.toast.undo?'<button data-a="toastundo">Deshacer</button>':'')+'</div>';
  r.innerHTML=h;
  [["photo",onPhoto],["idphoto",onIdPhoto],["nphoto",onNotePhoto],["impfile",onImportFile]].forEach(function(x){var el=document.getElementById(x[0]);if(el)el.addEventListener("change",x[1]);});
  Array.prototype.forEach.call(document.querySelectorAll("input[data-fu]"),function(el){el.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(f)followUp(el.getAttribute("data-fu"),f);});});
}

function taskRow(t){
  var late=t.days<0, when=t.days===0?"Hoy":late?("Atrasado "+(-t.days)+(t.days===-1?" día":" días")):("Faltan "+t.days+(t.days===1?" día":" días"));
  var pr=t.days<=0?prioOf(t):3, chip=pr===1?'<span class="prio p1">🔴 URGENTE</span>':pr===2?'<span class="prio p2">🟠 IMPORTANTE</span>':'';
  var right;
  if(t.days>0)right='<span class="when">'+(t.days===1?"Mañana":short(t.due))+'</span>';
  else if(t.kind==="control")right='<label class="btn sm" for="fu-t-'+t.p.id+'">📸 Tomar</label><input type="file" accept="image/*" capture="environment" id="fu-t-'+t.p.id+'" data-fu="'+t.p.id+'" style="display:none">';
  else if(t.kind==="inspeccion")right='<div style="display:flex;flex-direction:column;gap:4px"><button class="btn sm" data-a="done" data-p="'+t.p.id+'" data-k="inspeccion">Todo bien</button><button class="btn sm ghost" data-a="checkhealth" data-p="'+t.p.id+'">Veo algo</button></div>';
  else right='<button class="btn sm" data-a="done" data-p="'+t.p.id+'" data-k="'+t.kind+'"'+(t.remId||t.stepId?' data-r="'+(t.remId||t.stepId)+'"':'')+'>'+(t.kind==="medicion"?"Medir":"Listo ✓")+'</button>';
  if(ui.fuBusy===t.p.id&&t.kind==="control")right='<span class="spin">🌿</span>';
  var title=t.kind==="trat"?esc(t.label):esc(t.label)+' · '+esc(t.p.name);
  return '<div class="task'+(late||pr===1?" late":"")+'"><div class="ico i-'+t.kind+'">'+(t.icon||ICON[t.kind])+'</div><div class="t">'+chip+'<b>'+title+'</b><small>'+(t.kind==="trat"?t.p.emoji+' '+esc(t.p.name)+' · ':t.p.emoji+' ')+when+'</small></div>'+right+'</div>';
}

function seasonTips(){
  var m=new Date().getMonth()+1,hid=S.plants.some(function(p){return p.type==="hidro";});
  var r=(m>=5&&m<=11)?{t:"🌧️ Temporada lluviosa: más riesgo de hongos",tips:["No mojes las hojas al regar y riega solo si la tierra está seca al tacto.","Las plantas de exterior casi no necesitan riego extra en días de lluvia.","Vacía los platos con agua: evitas pudrición de raíz y zancudos."]}:{t:"☀️ Temporada seca: más sed y más plagas",tips:["Riega más seguido las de exterior y las macetas pequeñas.","Vigila la araña roja (telarañas finas): aparece con calor y aire seco.","Rocía las hojas de las plantas de interior en la mañana."]};
  if(hid)r.tips.push("Hidroponía: el agua caliente favorece la pudrición de raíz; mantenla bajo 24 °C y oxigenada.");
  return r;
}
function viewHoy(){
  if(!S.plants.length)return '<div class="empty"><div class="big">🌱</div><h2 style="color:var(--ink);margin-bottom:6px">Agrega tu primera planta</h2><p>Te diré cuándo regar, abonar o revisar tu hidroponía, y te ayudo a revisar si tiene alguna enfermedad.</p><br><button class="btn" data-a="new">+ Agregar planta</button></div>';
  var ts=allTasks(), now=ts.filter(function(t){return t.days<=0;}), soon=ts.filter(function(t){return t.days>0&&t.days<=7&&t.kind!=="inspeccion";});
  var alerts=[];
  S.plants.forEach(function(p){var a=readingAlert(p);if(a)alerts.push({p:p,msg:a.join(", ")});var hh=healthOf(p);if(hh||(p.treatment&&p.treatment.active))alerts.push({p:p,msg:hh?hh.title:p.treatment.title,sick:true,h:hh});});
  alerts.sort(function(a,b){function sc(x){var sv=x.h?x.h.sev:(x.p.treatment&&x.p.treatment.sev);return sv==="grave"?0:x.sick?1:2;}return sc(a)-sc(b);});
  var urg=now.filter(function(t){return t.pr<=2;}).length, care=now.filter(function(t){return t.pr===3;}).length;
  var title=urg?(urg+(urg===1?" tarea prioritaria":" tareas prioritarias")):care?("Tienes "+care+(care===1?" tarea":" tareas")+" hoy"):alerts.length?"Riego y abono al día":"Todo al día ✨";
  var sub=urg?"Empieza por las marcadas en rojo y naranja.":care?"Toca «Listo ✓» cuando termines cada una.":alerts.length?"Sigue el plan de las plantas en tratamiento.":"Tus plantas están atendidas. Vuelve mañana.";
  var h='<div class="hero"><h2>'+title+'</h2><p>'+sub+'</p><div class="stats"><div class="stat"><b>'+urg+'</b><span>prioritarias</span></div><div class="stat"><b>'+care+'</b><span>de cuidado</span></div><div class="stat"><b>'+alerts.filter(function(a){return a.sick;}).length+'</b><span>en tratamiento</span></div></div></div>';
  var st=seasonTips();
  h+='<div class="season"><button data-a="season" style="display:flex;width:100%;text-align:left;color:inherit"><b style="flex:1">'+st.t+'</b><span>'+(ui.seasonOpen?"▲":"▼")+'</span></button>'+(ui.seasonOpen?'<ul>'+st.tips.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'')+'</div>';
  if(alerts.length){h+='<div class="sec">Plantas que necesitan atención</div>';alerts.forEach(function(a){h+=alertCard(a);});}
  if(now.length){h+='<div class="sec">Para hoy, por prioridad</div>';now.forEach(function(t){h+=taskRow(t);});}
  if(soon.length){h+='<div class="sec">Próximos 7 días</div>';soon.forEach(function(t){h+=taskRow(t);});}
  return h;
}

function alertCard(a){
  var p=a.p,busy=ui.fuBusy===p.id;
  var h='<div class="alert"><button class="head" data-a="open" data-p="'+p.id+'">'+(p.thumb?'<img src="'+p.thumb+'" alt="">':'<span class="ico">'+p.emoji+'</span>')+'<span style="flex:1;min-width:0"><b style="display:block">'+(a.sick?"🩺 ":"⚠️ ")+esc(p.name)+'</b><small style="color:var(--muted)">'+esc(a.msg)+(a.h?' · '+nice(a.h.d):'')+'</small></span><span style="color:var(--muted);font-size:20px">›</span></button>';
  if(busy)return h+'<div class="read" style="background:var(--leafbg);color:var(--leaf)"><span class="spin">🌿</span> Comparando con la foto anterior…</div></div>';
  if(a.sick){
    var tr=p.treatment&&p.treatment.active?p.treatment:null;
    if(ui.planBusy===p.id)h+='<div class="read" style="background:var(--leafbg);color:var(--leaf)"><span class="spin">🌿</span> Armando el plan de tratamiento…</div>';
    else if(tr){var dn=tr.steps.filter(function(x){return x.done;}).length,nx=tr.steps.filter(function(x){return !x.done;}).sort(function(x,y){return x.day-y.day;})[0];
      h+='<div style="margin-top:8px;font-size:13px"><span class="prio '+(tr.priority==="alta"?"p1":"p2")+'">'+(tr.priority==="alta"?"🔴 PRIORIDAD ALTA":"🟠 PRIORIDAD MEDIA")+'</span> Plan: '+dn+' de '+tr.steps.length+' pasos<div class="bar"><i style="width:'+Math.round(100*dn/Math.max(1,tr.steps.length))+'%"></i></div>'+(nx?'👉 Siguiente: <b>'+esc(nx.action)+'</b> ('+nice(addDays(tr.start,nx.day))+')':'✅ Pasos completos: toma una foto de control.')+'</div>';}
    h+='<div class="acts">'+(!tr&&ui.planBusy!==p.id?'<button class="btn sm" data-a="mkplan" data-p="'+p.id+'">📋 Qué hago</button>':'')+'<label class="btn sm '+(tr?'':'ghost')+'" for="fu-'+p.id+'">📸 Foto control</label><input type="file" accept="image/*" capture="environment" id="fu-'+p.id+'" data-fu="'+p.id+'" style="display:none"><button class="btn sm ghost" data-a="healed" data-p="'+p.id+'">✓ Está bien</button></div>';
  }
  else h+='<div class="acts"><button class="btn sm" data-a="done" data-p="'+p.id+'" data-k="medicion">📏 Medir de nuevo</button><button class="btn sm ghost" data-a="open" data-p="'+p.id+'">Ver planta</button></div>';
  return h+'</div>';
}
function plantCard(p){
  var ts=tasksFor(p), late=ts.filter(function(t){return t.days<=0;}), hh=healthOf(p), al=readingAlert(p);
  var badge=hh?'<span class="badge b-bad">Revisar salud</span>':al?'<span class="badge b-bad">Fuera de rango</span>':late.length?'<span class="badge b-warn">'+late.map(function(t){return t.label.split(" ")[0];}).join(" · ")+'</span>':'<span class="badge b-ok">Al día</span>';
  var next=ts.slice().sort(function(a,b){return a.days-b.days;})[0];
  return '<button class="pcard" data-a="open" data-p="'+p.id+'">'+(p.thumb?'<img class="thumb" src="'+p.thumb+'" alt="">':'<span class="em">'+p.emoji+'</span>')+'<b>'+(p.thumb?p.emoji+' ':'')+esc(p.name)+'</b><small>'+(p.type==="hidro"?"💧 Hidroponía":"Tierra")+(p.place?" · "+esc(p.place):"")+'</small>'+badge+'<small>'+next.label+': '+nice(next.due)+'</small>'+(function(){var lp=photosOf(p).slice(-1)[0];return lp?'<small>📸 Última foto: '+nice(lp.d)+'</small>':'';})()+'</button>';
}
function catOf(p){return p.category&&CATS.indexOf(p.category)>=0?p.category:"Otras";}
function viewPlantas(){
  if(!S.plants.length)return '<div class="empty"><div class="big">📷</div><p>Toma una foto de tu planta y la identifico por ti.</p><br><button class="btn" data-a="new">+ Agregar planta</button></div>';
  var used=CATS.filter(function(c){return S.plants.some(function(p){return catOf(p)===c;});});
  if(ui.cat&&used.indexOf(ui.cat)<0)ui.cat="";

function spark(vals,min,max,color){
  if(vals.length<2)return "";
  var lo=Math.min.apply(null,vals.concat([min])),hi=Math.max.apply(null,vals.concat([max]));if(hi===lo)hi=lo+1;
  var W=300,H=56,pd=6;
  function y(v){return pd+(H-2*pd)*(1-(v-lo)/(hi-lo));}
  var pts=vals.map(function(v,i){return (pd+i*(W-2*pd)/(vals.length-1)).toFixed(1)+","+y(v).toFixed(1);}).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><rect x="0" y="'+y(max)+'" width="'+W+'" height="'+Math.max(2,y(min)-y(max))+'" fill="#e4efe0"/><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}

function fixTip(al){

  return esc(t.join(". "))+".";
}

function mkProp(p){
  if(!SAMPLE)return;
  ui.propBusy=p.id;render();
  var prompt="Eres viverista experto en Costa Rica. Planta: "+p.name+(p.sci?" ("+p.sci+")":"")+", cultivo "+(p.type==="hidro"?"hidropónico":"en tierra")+".\nExplica cómo reproducirla en casa (sacarle hijos): solo los métodos que de verdad funcionan para esta planta (esqueje en agua o tierra, hijuelos, división de mata, acodo, semilla) y si se puede injertar.\nResponde SOLO JSON válido en español sencillo: {\"methods\":[{\"name\":\"emoji + nombre del método\",\"difficulty\":\"Fácil\"|\"Media\"|\"Difícil\",\"when\":\"mejor época o momento\",\"time\":\"tiempo hasta tener raíces o brotes\",\"steps\":[\"4 a 7 pasos concretos, con materiales caseros\"]}] (1 a 3 métodos, el más fácil primero),\"graft\":{\"possible\":true|false,\"rootstock\":\"en qué patrón se injerta, si aplica\",\"note\":\"1-2 frases\",\"steps\":[\"pasos del injerto si es posible, si no lista vacía\"]},\"tip\":\"un consejo clave\"}";
  SAMPLE.json(prompt,{modelTier:"default"}).then(function(r){
    p.prop={methods:(r.methods||[]).slice(0,3).map(function(m){return {name:String(m.name||"Método"),difficulty:String(m.difficulty||""),when:String(m.when||""),time:String(m.time||""),steps:(m.steps||[]).map(String).slice(0,8)};}),graft:{possible:!!(r.graft&&r.graft.possible),rootstock:String((r.graft&&r.graft.rootstock)||""),note:String((r.graft&&r.graft.note)||""),steps:((r.graft&&r.graft.steps)||[]).map(String).slice(0,8)},tip:String(r.tip||"")};

}

function newForm(type){
  return {id:null,type:type||"tierra",name:"",emoji:type==="hidro"?"🥬":"🪴",place:"",water:3,feed:21,check:3,sol:14,phMin:5.5,phMax:6.5,ecMin:1.0,ecMax:1.6,lastWater:today(),lastFeed:today(),lastSol:today(),notes:"",category:"",sci:"",thumb:"",care:null,reminders:[]};

function readForm(){
  var f=ui.form;
  function v(id){var el=document.getElementById(id);return el?el.value:undefined;}
  function n(id,def){var x=parseFloat(v(id));return isNaN(x)?def:x;}
  if(v("f-name")!==undefined)f.name=v("f-name");
  if(v("f-place")!==undefined)f.place=v("f-place");
  if(v("f-notes")!==undefined)f.notes=v("f-notes");
  if(v("f-cat")!==undefined)f.category=v("f-cat");
  if(v("f-sci")!==undefined)f.sci=v("f-sci");
  if(f.type==="tierra"){f.water=Math.max(1,Math.round(n("f-water",f.water)));f.feed=Math.max(1,Math.round(n("f-feed",f.feed)));if(v("f-lw"))f.lastWater=v("f-lw");if(v("f-lf"))f.lastFeed=v("f-lf");}
  else{f.check=Math.max(1,Math.round(n("f-check",f.check)));f.sol=Math.max(1,Math.round(n("f-sol",f.sol)));f.phMin=n("f-phmin",f.phMin);f.phMax=n("f-phmax",f.phMax);f.ecMin=n("f-ecmin",f.ecMin);f.ecMax=n("f-ecmax",f.ecMax);if(v("f-ls"))f.lastSol=v("f-ls");}
}

function onPhoto(e){
  var file=e.target.files&&e.target.files[0]; if(!file)return;
  keepNote();
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    var max=1024,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    var c2=document.createElement("canvas"),s2=Math.min(1,320/Math.max(w,h));c2.width=Math.round(w*s2);c2.height=Math.round(h*s2);c2.getContext("2d").drawImage(img,0,0,c2.width,c2.height);
    c.toBlob(function(b){ui.diag.img=b;ui.diag.imgUrl=c.toDataURL("image/jpeg",.8);ui.diag.thumb=c2.toDataURL("image/jpeg",.72);URL.revokeObjectURL(url);render();},"image/jpeg",.85);
  };
  img.src=url;
}
function makeImages(file,cb){
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    function draw(max){var sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c;}
    var big=draw(1024),small=draw(320),thumb=small.toDataURL("image/jpeg",.72);
    big.toBlob(function(b){URL.revokeObjectURL(url);cb(b,thumb);},"image/jpeg",.85);
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(null,"");};
  img.src=url;
}
function onIdPhoto(e){
  var file=e.target.files&&e.target.files[0]; if(!file)return;
  ui.idErr="";
  makeImages(file,function(blob,thumb){
    if(!blob){ui.idErr="No pude leer esa foto. Intenta con otra.";render();return;}
    ui.idBusy={thumb:thumb};render();identify(blob,thumb);
  });
}
function dataUrlBlob(u){try{var p=u.split(","),bin=atob(p[1]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:"image/jpeg"});}catch(e){return null;}}
function followUp(pid,file){
  ui.fuBusy=pid;render();

}
function followUpImg(pid,blob,thumb){
  var p=plant(pid);if(!p)return;
  var prev=photosOf(p).slice(-1)[0]||null, last=lastHealth(p);
  ui.fuBusy=pid;render();
  (function(){
    if(!blob){ui.fuBusy=null;render();return;}
    function done(r){
      r.kind="foto";r.plantId=pid;r.thumb=thumb;
      if(!prev&&!p.thumb)r.first=true;
      addLog(r);p.thumb=thumb;autoPlan(p);ui.fuBusy=null;save();render();
    }
    if(!SAMPLE){done({title:"Foto de seguimiento",src:"manual"});return;}
    var ctx="Planta: "+p.name+(p.sci?" ("+p.sci+")":"")+", "+(p.type==="hidro"?"hidroponía":"en tierra")+". ";
    if(last)ctx+="Último estado registrado ("+last.d+"): "+(last.title||"")+(last.why?" — "+last.why:"")+". ";
    var imgs=[blob],pb=prev?dataUrlBlob(prev.thumb):null;
    if(pb)imgs=[pb,blob];
    var prompt="Eres agrónomo experto en plantas en Costa Rica. "+ctx+(pb?"La PRIMERA imagen es la foto anterior ("+prev.d+") y la SEGUNDA es la foto de hoy ("+today()+"). Compara cómo estaba y cómo está.":"Esta es la foto de hoy.")+"\nResponde SOLO con JSON válido en español sencillo: {\"trend\":\"mejor\"|\"igual\"|\"peor\""+(pb?"":" (usa igual si no hay foto anterior)")+",\"sev\":\"sana\"|\"atencion\"|\"grave\",\"title\":\"estado actual en máx 6 palabras\",\"why\":\"1-2 frases: qué cambió entre fotos y qué ves hoy\",\"steps\":[\"1 a 3 acciones concretas para esta semana\"]"+PLAN_SCHEMA+"}";
    SAMPLE.limits().then(function(l){if(!l||!l.images)throw {code:"noimg"};return SAMPLE.json(prompt,{images:imgs,modelTier:"default"});})
    .then(function(r){var sv0=["sana","atencion","grave"].indexOf(r.sev)>=0?r.sev:"atencion";startPlan(p,r,String(r.title||"Tratamiento"),sv0);done({trend:pb&&["mejor","igual","peor"].indexOf(r.trend)>=0?r.trend:null,sev:["sana","atencion","grave"].indexOf(r.sev)>=0?r.sev:"atencion",title:String(r.title||"Foto de seguimiento").slice(0,60),why:String(r.why||""),steps:(r.steps||[]).map(String).slice(0,3),src:"ia"});})
    .catch(function(){done({title:"Foto de seguimiento",src:"manual"});});
  })();
}

function clampN(x,lo,hi,def){x=parseFloat(x);return isNaN(x)?def:Math.min(hi,Math.max(lo,x));}
function careFrom(r){
  var c=r.care||{};
  return {light:String(c.light||""),water:String(c.water||""),humidity:String(c.humidity||""),temp:String(c.temp||""),tips:(c.tips||[]).map(String).slice(0,5)};
}

  return (r.reminders||[]).slice(0,4).map(function(x){return {id:uid(),label:String(x.label||"Recordatorio").slice(0,40),every:Math.round(clampN(x.every,1,365,14)),icon:String(x.icon||"🔔").slice(0,4),start:today()};}).filter(function(x){return !/regar|abonar|riego|abono/i.test(x.label);});
}
var CARE_SCHEMA='"care":{"light":"luz que necesita, frase corta","water":"cómo regarla, frase corta","humidity":"humedad ideal, frase corta","temp":"rango de temperatura","tips":["2 a 4 consejos prácticos para Costa Rica"]},"reminders":[{"label":"tarea extra de cuidado (NO riego ni abono), máx 4 palabras","every":días,"icon":"un emoji"}] (1 a 3)';
function identify(blob,thumb){
  function manual(msg){var f=newForm("tierra");f.thumb=thumb;ui.form=f;ui.idBusy=null;ui.idInfo=msg;openSheet({k:"form"});}
  if(!SAMPLE){manual("No pude conectar con Claude para reconocerla. Completa el nombre a mano; la foto ya quedó guardada.");return;}
  var prompt="Eres botánico y experto en huertos e hidroponía en Costa Rica. Identifica la planta de la foto.\nResponde SOLO con JSON válido en español:\n{\"found\":true|false,\"name\":\"nombre común usado en Costa Rica\",\"sci\":\"nombre científico\",\"confidence\":\"alta\"|\"media\"|\"baja\",\"emoji\":\"uno de: "+EMOJIS.join(" ")+"\",\"category\":\"una de: "+CATS.join(", ")+"\",\"type\":\"tierra\" o \"hidro\" (hidro solo si se ven raíces en agua, canastillas o tubos),\"water\":días entre riegos en clima tropical,\"feed\":días entre abonos,\"check\":días entre mediciones pH/EC si es hidro,\"sol\":días entre cambios de solución si es hidro,\"phMin\":n,\"phMax\":n,\"ecMin\":n,\"ecMax\":n,"+CARE_SCHEMA+",\"health\":\"sana\"|\"atencion\"|\"grave\",\"healthNote\":\"si se ve algún problema, nómbralo en máx 6 palabras; si no, vacío\"}\nSi no es una planta o no se distingue, found=false.";
  SAMPLE.limits().then(function(l){if(!l||!l.images)throw {code:"noimg"};return SAMPLE.json(prompt,{images:[blob],modelTier:"default"});})
  .then(function(r){
    if(!r||r.found===false||!r.name){ui.idBusy=null;ui.idErr="No logré reconocer una planta en la foto. Prueba de más cerca, con buena luz y una hoja completa.";render();return;}
    var f=newForm(r.type==="hidro"?"hidro":"tierra");
    f.name=String(r.name).slice(0,40);f.sci=String(r.sci||"").slice(0,60);f.thumb=thumb;
    f.emoji=EMOJIS.indexOf(r.emoji)>=0?r.emoji:"🪴";f.category=CATS.indexOf(r.category)>=0?r.category:"Otras";
    f.water=Math.round(clampN(r.water,1,60,3));f.feed=Math.round(clampN(r.feed,3,120,21));f.check=Math.round(clampN(r.check,1,14,3));f.sol=Math.round(clampN(r.sol,3,45,14));
    f.phMin=clampN(r.phMin,4,8,5.5);f.phMax=clampN(r.phMax,4,8.5,6.5);f.ecMin=clampN(r.ecMin,0.2,5,1.0);f.ecMax=clampN(r.ecMax,0.3,6,1.6);
    f.care=careFrom(r);f.reminders=remsFrom(r);

  if(p&&p.type!=="hidro"){var la=lastOf(p.id,"agua");ctx+="Riega cada "+p.water+" días; abona cada "+p.feed+" días."+(la?" Último riego: "+la.d+".":"")+"\n";}
  ctx+="Síntomas marcados: "+(d.sym.length?d.sym.map(function(s){return SYMPTOMS.filter(function(x){return x[0]===s;})[0][1];}).join(", "):"ninguno")+".\nNotas del dueño: "+((d.note||"").trim()||"ninguna")+".\n";
  var prompt="Eres un agrónomo experto en plantas de casa, huerto e hidroponía, en Costa Rica (clima tropical). "+(d.img?"Mira la foto adjunta y ":"")+"usa estos datos para identificar la causa más probable del problema (enfermedad por hongo/bacteria/virus, plaga, deficiencia de nutrientes, pH/EC, riego o luz).\n\n"+ctx+"\nResponde SOLO con JSON válido, en español sencillo, con esta forma exacta:\n{\"sev\":\"sana\"|\"atencion\"|\"grave\",\"title\":\"nombre corto del problema (máx 6 palabras)\",\"why\":\"1-2 frases: qué ves y por qué crees que es eso\",\"steps\":[\"3 a 5 pasos concretos y caseros para tratarla\"],\"other\":[\"0 a 2 otras causas posibles\"]"+PLAN_SCHEMA+"}\nSi la foto no muestra una planta o no se ve bien, usa sev \"atencion\", title \"Foto poco clara\" y en steps pide otra foto más cerca con buena luz.";
  var opts={modelTier:"default"};
  var go=function(useImg){ if(useImg)opts.images=[d.img]; return SAMPLE.json(prompt,opts); };
  (d.img?SAMPLE.limits().then(function(l){return go(!!(l&&l.images));}).catch(function(){return go(false);}):go(false))
  .then(function(r){
    if(!r||!r.title)throw {message:"respuesta vacía"};
    if(p)startPlan(p,r,String(r.title),r.sev||"atencion");
    finishDiag({sev:r.sev||"atencion",title:String(r.title),why:String(r.why||""),steps:(r.steps||[]).map(String).slice(0,6),other:(r.other||[]).map(String).slice(0,3),src:"ia"});
  }).catch(function(e){
    d.busy=false;
    var r=localDiag(d.sym);
    if(e&&e.code==="not_granted"){SAMPLE=null;}
    if(r){finishDiag(r);return;}
    d.err=(e&&e.code==="rate_limited")?"Muchas revisiones seguidas. Intenta en un minuto.":"No pude analizar la foto. Marca los síntomas para usar la guía rápida.";
    render();
  });
}
function finishDiag(r){
  var d=ui.diag;
  r.kind="salud";r.plantId=d.plant||null;if(d.thumb)r.thumb=d.thumb;
  addLog(r);autoPlan(plant(d.plant));
  ui.diag={plant:d.plant,sym:[],img:null,imgUrl:"",busy:false,err:"",note:""};
  save();render();
  setTimeout(function(){var el=document.querySelector(".diag");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},50);
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el)return;
  var a=el.getAttribute("data-a"),v=el.getAttribute("data-v"),pid=el.getAttribute("data-p");
  if(a==="bgclose"){if(e.target===el){ui.sheet=null;render();}return;}
  if(a==="tab"){ui.tab=v;ui.cat="";ui.sheet=null;try{history.replaceState(null,"","#"+v);}catch(x){location.hash=v;}render();window.scrollTo(0,0);}
  else if(a==="close"){ui.sheet=null;render();}
  else if(a==="new"){ui.addType=v||(ui.tab==="hidro"?"hidro":"tierra");ui.idErr="";ui.idBusy=null;openSheet({k:"add"});}
  else if(a==="manual"){ui.form=newForm(ui.addType||"tierra");ui.idInfo=null;openSheet({k:"form"});}
  else if(a==="cat"){ui.cat=v;render();}

  else if(a==="au-send"){var em=(document.getElementById("au-email").value||"").trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ui.auth.err="Escribe un correo válido.";render();return;}ui.auth={step:"email",email:em,busy:true,err:""};render();MJSync.sendCode(em).then(function(){ui.auth={step:"code",email:em,busy:false,err:""};render();}).catch(function(e){var msg=(e&&e.message)||"error";ui.auth={step:"email",email:em,busy:false,err:/rate|limit|seconds/i.test(msg)?"Se pidieron muchos códigos seguidos. Espera unos minutos y vuelve a intentar.":/sending|smtp|email/i.test(msg)?"El servidor de correo no pudo enviar el código ("+msg+"). Revisa la configuración SMTP en Supabase.":"No se pudo enviar el código: "+msg};render();});}
  else if(a==="au-verify"){var cd=(document.getElementById("au-code").value||"").replace(/\D/g,"");if(cd.length<6){ui.auth.err="Escribe el código completo que llegó al correo.";render();return;}ui.auth.busy=true;ui.auth.err="";render();MJSync.verify(ui.auth.email,cd).then(function(){ui.auth={step:"email",email:"",busy:false,err:""};showToast("☁️ ¡Listo! Tu jardín se está guardando en la nube.");setTimeout(loadMembers,2500);render();}).catch(function(e){ui.auth.busy=false;ui.auth.err="Código incorrecto o vencido. Pide uno nuevo.";render();});}
  else if(a==="au-back"){ui.auth={step:"email",email:ui.auth.email,busy:false,err:""};render();}
  else if(a==="invite"){var ie=(document.getElementById("inv-email").value||"").trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ie)){showToast("Escribe un correo válido.");render();return;}MJSync.invite(ie).then(function(){showToast("✉️ Listo: "+ie+" verá este jardín al entrar con ese correo.");loadMembers();}).catch(function(e){showToast("No se pudo invitar: "+((e&&e.message)||"error"));render();});}
  else if(a==="sync-now"){MJSync.run();}
  else if(a==="logout"){ui.confirmLogout=true;render();}
  else if(a==="logout-no"){ui.confirmLogout=false;render();}
  else if(a==="logout-yes"){ui.confirmLogout=false;MJSync.logout().then(function(){S={v:0,plants:[],log:[]};MJStore.save(S).catch(function(){});ui.sheet=null;render();showToast("Sesión cerrada. Tus datos siguen en la nube.");});}
  else if(a==="exportar"){exportar();}
  else if(a==="impno"){ui.importData=null;render();}
  else if(a==="impok"){var ns=ui.importData&&ui.importData.s;if(ns){ns.v=Math.max(ns.v||0,S.v||0);S=ns;ui.importData=null;ui.sheet=null;save();showToast("✅ Respaldo importado: "+S.plants.length+" plantas.");render();}}
  else if(a==="mkplan"){mkPlan(plant(pid));}
  else if(a==="season"){ui.seasonOpen=!ui.seasonOpen;render();}
  else if(a==="mkprop"){mkProp(plant(pid));}
  else if(a==="propopen"){ui.propOpen=ui.propOpen===v?null:v;render();}
  else if(a==="newkid"){newKid(plant(pid),v);}
  else if(a==="matchpick"){var u=ui.pending;ui.pending=null;ui.sheet={k:"plant",pid:pid};followUpImg(pid,u.blob,u.thumb);}
  else if(a==="matchnew"){var u2=ui.pending;ui.pending=null;u2.f.name=uniqueName(u2.f.name);ui.idInfo=(ui.idInfo||"")+'<br>📍 Ponle dónde está (o un apodo) para distinguirla de la otra.';ui.form=u2.f;openSheet({k:"form"});}
  else if(a==="toastundo"){var u=ui.toast&&ui.toast.undo;S.log=S.log.filter(function(l){return l.id!==u;});showToast("Deshecho.",null,2500);save();render();}
  else if(a==="healed"){var ph0=plant(pid);if(ph0&&ph0.treatment&&ph0.treatment.active){ph0.treatment.active=false;ph0.treatment.end=today();ph0.treatment.outcome="Recuperada";}showToast("🎉 ¡Qué bien! Queda anotado que se recuperó.");addLog({plantId:pid,kind:"salud",sev:"sana",title:"Recuperada ✅",why:"Marcada como recuperada.",steps:[],other:[],src:"manual"});save();render();}
  else if(a==="mkcare"){mkCare(plant(pid));}
  else if(a==="remsug"){var pp=plant(pid),sg=REM_SUG[+v];pp.reminders=pp.reminders||[];pp.reminders.push({id:uid(),icon:sg[0],label:sg[1],every:sg[2],start:today()});save();render();}
  else if(a==="remadd"){var pp2=plant(pid),lb=(document.getElementById("r-label").value||"").trim(),ev=parseInt(document.getElementById("r-every").value,10);if(!lb){document.getElementById("r-label").focus();return;}pp2.reminders=pp2.reminders||[];pp2.reminders.push({id:uid(),icon:"🔔",label:lb.slice(0,40),every:Math.max(1,ev||7),start:today()});save();render();}
  else if(a==="remdel"){var pp3=plant(pid);pp3.reminders=(pp3.reminders||[]).filter(function(r){return r.id!==v;});save();render();}
  else if(a==="noteadd"){var tx=(document.getElementById("n-text").value||"").trim();if(!tx&&!ui.noteThumb){document.getElementById("n-text").focus();return;}var ne={plantId:pid,kind:"nota",text:tx.slice(0,500)};if(ui.noteThumb)ne.thumb=ui.noteThumb;addLog(ne);ui.noteText="";ui.noteThumb="";save();render();}
  else if(a==="edit"){var p=plant(pid);ui.form=JSON.parse(JSON.stringify(p));openSheet({k:"form"});}
  else if(a==="ftype"){readForm();ui.form.type=v;if(v==="hidro"&&ui.form.emoji==="🪴")ui.form.emoji="🥬";render();}
  else if(a==="femo"){readForm();ui.form.emoji=v;render();}
  else if(a==="preset"){readForm();var pr=PRESETS[+v],f=ui.form;f.type=pr.type;f.emoji=pr.e;if(!f.name)f.name=pr.n.replace(" (hidro)","");f.category=pr.c;["water","feed","check","sol","phMin","phMax","ecMin","ecMax"].forEach(function(k){if(pr[k]!=null)f[k]=pr[k];});render();}

    else{f.name=uniqueName(f.name.trim());f.id=uid();f.created=today();var hl=f._health;delete f._health;S.plants.push(f);if(f.thumb)addLog({plantId:f.id,kind:"foto",thumb:f.thumb,first:true,title:hl?hl.title:"Foto inicial",why:hl?"Detectado al identificar la planta.":"",sev:hl?hl.sev:"sana",src:"ia"});}
    ui.idInfo=null;
    ui.sheet={k:"plant",pid:f.id};save();render();
  }
  else if(a==="open"){openSheet({k:"plant",pid:pid});}
  else if(a==="done"){doTask(pid,el.getAttribute("data-k"),el.getAttribute("data-r"));}
  else if(a==="msave"){
    function num(id){var x=parseFloat(document.getElementById(id).value);return isNaN(x)?"":x;}
    var ph=num("m-ph"),ec=num("m-ec"),tp=num("m-temp");
    if(ph===""&&ec===""){document.getElementById("m-ph").focus();return;}
    addLog({plantId:pid,kind:"medicion",ph:ph,ec:ec,temp:tp});showToast("📏 Medición guardada.");ui.sheet={k:"plant",pid:pid};save();render();
  }
  else if(a==="undo"){S.log=S.log.filter(function(l){return l.id!==v;});save();render();}
  else if(a==="del"){ui.confirmDel=true;render();}
  else if(a==="delno"){ui.confirmDel=false;render();}
  else if(a==="delyes"){S.plants=S.plants.filter(function(p){return p.id!==pid;});S.log=S.log.filter(function(l){return l.plantId!==pid;});ui.sheet=null;ui.confirmDel=false;save();render();}
  else if(a==="checkhealth"){ui.tab="salud";ui.sheet=null;keepNote();ui.diag.plant=pid;render();window.scrollTo(0,0);}
  else if(a==="sym"){keepNote();var i2=ui.diag.sym.indexOf(v);if(i2>=0)ui.diag.sym.splice(i2,1);else ui.diag.sym.push(v);render();}

});

  if(e.target.getAttribute&&e.target.getAttribute("data-a")==="dplant"){keepNote();ui.diag.plant=e.target.value;}

var h0=(location.hash||"").replace("#","");
if(["hoy","plantas","hidro","salud"].indexOf(h0)>=0)ui.tab=h0;
ui.loading=true;
try{var tt=JSON.parse(sessionStorage.getItem("miJardin.toast")||"null");if(tt&&tt.until>Date.now()){if(tt.undo&&!S.log.some(function(l){return l.id===tt.undo;}))tt.undo=null;showToast(tt.msg,tt.undo,tt.until-Date.now());}}catch(e){}
render();
function boot(){
  function legacy(){
    var s=null;
    try{var l=localStorage.getItem(LS_KEY);if(l)s=JSON.parse(l);}catch(e){}
    try{var el=document.getElementById("state");if(el){var e2=JSON.parse(el.textContent);if(!s||(e2.v||0)>(s.v||0))s=e2;}}catch(e){}
    return s&&s.plants&&s.plants.length?s:null;
  }
  if(!window.MJStore){ui.loading=false;render();showToast("⚠️ Este navegador no permite guardar datos.",null,9000);return;}
  MJStore.load().then(function(st){
    ui.loading=false;
    if(st){S=normState(st);}
    else{var lg=legacy();if(lg){S=normState(lg);MJStore.save(S).catch(function(){});}}
    render();
    if(window.MJSync)MJSync.init(function(){return S;},function(ns){S=normState(ns);MJStore.save(S).catch(function(){});softRender();},softRender);
  }).catch(function(e){ui.loading=false;render();showToast("⚠️ No pude abrir los datos guardados ("+((e&&e.message)||"error")+").",null,9000);});
  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
}
boot();
})();

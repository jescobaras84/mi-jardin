<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Jardín</title>
<meta name="theme-color" content="#f6f7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Jardín">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style id="app-css">
@font-face{font-family:Geist;font-weight:400;font-display:swap;src:url(fonts/geist-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Geist;font-weight:500;font-display:swap;src:url(fonts/geist-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Geist;font-weight:600;font-display:swap;src:url(fonts/geist-latin-600-normal.woff2) format("woff2")}
:root{
  --bg:#f6f7f3; --card:#ffffff; --ink:#17201a; --muted:#5f6b63; --faint:#8a958d; --line:#e4e8e1; --fill:#eef1ec;
  --leaf:#2e6a3e; --leaf2:#3f8a52; --leafbg:#e6efe5; --sun:#b7841c; --sunbg:#f8efd9;
  --rust:#b4492f; --rustbg:#f8e6df; --water:#24485f; --waterbg:#e8f0f6; --plum:#5b4a86; --plumbg:#eeeaf6;
  --r:16px; --ease:cubic-bezier(0.23,1,0.32,1);
  --shadow:0 1px 2px rgba(23,32,26,.04),0 6px 20px -10px rgba(23,32,26,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
h1,h2,h3{font-weight:600;letter-spacing:-0.02em;line-height:1.15}
p{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[data-a],label[for]{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
.ic.lg{width:24px;height:24px}
b,.stat b,.when,.bar{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 18px}
header.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px;gap:12px}
header.top h1{font-size:26px;letter-spacing:-0.03em}
header.top .date{color:var(--muted);font-size:14px}
header.top .date:first-letter{text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform 160ms var(--ease)}
.iconbtn:active{transform:scale(0.94)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;height:32px;padding:0 12px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-weight:500}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--leaf2)}
.saving{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:50;opacity:0;transition:opacity 200ms ease;pointer-events:none}
.saving.on{opacity:1}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.sec{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;margin:26px 2px 10px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);box-shadow:0 0 0 1px var(--line);margin-bottom:8px}
.task .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;color:var(--ink);background:var(--fill)}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.task .t small{color:var(--muted);font-size:13px}
.task.late{box-shadow:0 0 0 1px #ecc7ba;background:#fffaf8}
.i-agua{background:var(--waterbg)!important;color:var(--water)!important} .i-abono{background:var(--sunbg)!important;color:#7a5a12!important} .i-medicion{background:var(--leafbg)!important;color:var(--leaf)!important} .i-solucion{background:var(--plumbg)!important;color:var(--plum)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border-radius:999px;font-weight:600;font-size:15px;background:var(--ink);color:#fff;min-height:44px;transition:transform 160ms var(--ease),background-color 200ms ease;white-space:nowrap}
.btn:active{transform:scale(0.97)}
.btn.sm{padding:0 14px;min-height:36px;font-size:14px}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.btn.danger{background:var(--rustbg);color:var(--rust)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;color:var(--leaf)}
.empty h2{font-size:22px}
.hero{padding:2px 2px 6px;margin-bottom:6px}
.hero h2{font-size:28px;letter-spacing:-0.03em;margin-bottom:4px}
.hero p{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:16px;background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line)}
.stat{padding:12px 14px}
.stat+.stat{box-shadow:-1px 0 0 var(--line)}
.stat b{font-size:24px;font-weight:600;display:block;letter-spacing:-0.02em;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--rust)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow),0 0 0 1px var(--line);transition:transform 160ms var(--ease)}
.pcard:active{transform:scale(0.98)}
.pcard .em{font-size:30px;width:100%;aspect-ratio:4/3;display:grid;place-items:center;background:var(--fill);border-radius:12px}
.pcard b{font-weight:600;font-size:15px;line-height:1.25;margin-top:3px}
.pcard small{color:var(--muted);font-size:12px}
.badge{font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;width:max-content}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--leafbg);color:var(--leaf)} .b-warn{background:var(--sunbg);color:#7a5a12} .b-bad{background:var(--rustbg);color:var(--rust)} .b-hid{background:var(--waterbg);color:var(--water)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(246,247,243,.82);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(4px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--faint);font-weight:500;border-radius:12px;transition:color 150ms ease}
nav.tabs button .ic{width:24px;height:24px}
nav.tabs button.on{color:var(--leaf)}
nav.tabs button.on .ic{stroke-width:2.2}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -6px rgba(46,106,62,.5);z-index:15;transition:transform 160ms var(--ease)}
.fab:active{transform:scale(0.94)}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:12px 14px;border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;background:#fff;font-size:16px;transition:box-shadow 150ms ease;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:inset 0 0 0 2px var(--leaf)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:500;font-size:14px;color:var(--muted);transition:background-color 150ms ease,color 150ms ease}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(23,32,26,.08),0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 13px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;font-size:14px;transition:transform 140ms var(--ease)}
.chip:active{transform:scale(0.96)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.emo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.emo button{width:44px;height:44px;border-radius:12px;font-size:22px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.emo button.on{box-shadow:inset 0 0 0 2px var(--leaf);background:var(--leafbg)}
.sheet-bg{position:fixed;inset:0;background:rgba(23,32,26,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade 200ms ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up 320ms var(--ease);overscroll-behavior:contain}
.sheet:before{content:"";display:block;width:36px;height:5px;border-radius:99px;background:#d3d8d0;margin:0 auto 14px}
.sheet h2{font-size:22px;margin-bottom:14px}
.sheet .x{float:right;width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--muted);font-size:15px;display:grid;place-items:center}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.log{font-size:14px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.log:last-child{border:0}
.log .d{color:var(--faint);min-width:64px;font-variant-numeric:tabular-nums}
.log .ic{width:16px;height:16px;vertical-align:-3px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.read{border-radius:12px;padding:10px 12px;display:flex;gap:8px;margin-top:8px;font-size:14px}
.photo-drop{border:1.5px dashed #cfd6cc;border-radius:var(--r);padding:24px;text-align:center;background:#fff;color:var(--muted);display:block}
.photo-drop img{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:0 auto}
.diag h3{font-size:19px;margin-bottom:4px}
.diag ul{padding-left:18px;margin:6px 0}
.diag li{margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.confirm{background:var(--rustbg);border-radius:12px;padding:12px;margin-top:10px}
.spark{display:block;width:100%;height:56px}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--fill)}
.hero-img{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);display:block;margin-bottom:12px}
.i-rem{background:#f6e9ee!important;color:#8a3b57!important} .i-nota{background:var(--fill)}
.big-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow),0 0 0 1px var(--line);transition:transform 160ms var(--ease)}
.big-opt:active{transform:scale(0.98)}
.big-opt .bi{font-size:26px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--leafbg);color:var(--leaf);flex:none}
.big-opt b{display:block;font-size:16px}
.big-opt small{color:var(--muted)}
.idbox{display:flex;gap:12px;align-items:center;background:var(--leafbg);border-radius:14px;padding:10px;margin-bottom:14px;font-size:14px;color:#24502c}
.idbox img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.diary{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.diary:last-child{border:0}
.diary img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.alert{background:var(--card);box-shadow:var(--shadow),0 0 0 1px #ecc7ba;border-radius:var(--r);padding:12px;margin-bottom:10px}
.alert .head{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.alert .head img,.alert .head .ico{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;display:grid;place-items:center;font-size:22px;background:var(--rustbg)}
.alert .acts{display:flex;gap:6px;margin-top:12px}
.alert .acts>*{flex:1;font-size:13px;padding:0 8px;min-height:38px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.cmp figcaption{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 14px}
.tl-i:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--dot,#9aa494);border:2px solid var(--card)}
.tl-i .rowx{display:flex;gap:10px}
.tl-i img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.dots i{width:14px;height:14px;border-radius:4px;display:block}
.trend{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.t-mejor{background:var(--leafbg);color:var(--leaf)} .t-igual{background:var(--fill);color:var(--muted)} .t-peor{background:var(--rustbg);color:var(--rust)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:60;box-shadow:0 12px 32px -8px rgba(23,32,26,.4);font-size:14px;animation:tin 320ms var(--ease)}
.toast button{color:#a6dcb2;font-weight:600;padding:6px 8px;flex:none}
@keyframes tin{from{transform:translateY(16px);opacity:0}}
.when{font-size:12px;font-weight:500;color:var(--muted);background:var(--fill);border-radius:99px;padding:6px 10px;flex:none}
.prio{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:4px;vertical-align:1px;display:inline-flex;align-items:center;gap:5px}
.prio:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p1{background:var(--rustbg);color:var(--rust)} .p2{background:var(--sunbg);color:#7a5a12}
.i-trat{background:var(--rustbg)!important;color:var(--rust)!important} .i-control{background:var(--plumbg)!important;color:var(--plum)!important} .i-inspeccion{background:var(--waterbg)!important;color:var(--water)!important} .i-cosecha{background:var(--sunbg)!important;color:#7a5a12!important}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--leaf2);border-radius:99px;transition:width 400ms var(--ease)}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.step:last-child{border:0}
.step .ck{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 1.5px #cfd6cc;flex:none;display:grid;place-items:center;font-size:13px;background:#fff;transition:background-color 150ms ease}
.step.done{color:var(--faint);text-decoration:line-through}
.step.done .ck{background:var(--leaf);box-shadow:none;color:#fff}
.season{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:var(--r);padding:12px 14px;margin:14px 0 0;font-size:14px;color:var(--ink)}
.season ul{padding-left:18px;margin-top:8px;color:var(--muted)}
.season li{margin-bottom:4px}
.rec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec .re{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none}
.lvl{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block}
.l-ok{background:var(--leafbg);color:var(--leaf)} .l-parcial{background:var(--sunbg);color:#7a5a12} .l-mito{background:var(--rustbg);color:var(--rust)}
.recbtn{font-size:12px;font-weight:600;color:var(--leaf);background:var(--leafbg);border-radius:99px;padding:3px 10px;margin-top:4px;display:inline-block}
.wx{display:flex;gap:10px;align-items:center;background:var(--waterbg);border-radius:var(--r);padding:11px 14px;margin-top:8px;font-size:14px;color:var(--water)}
.wx b{color:#18374b}
.who{font-size:11px;font-weight:500;color:var(--water);background:var(--waterbg);border-radius:99px;padding:1px 8px;margin-left:6px;display:inline-flex;align-items:center;gap:3px;vertical-align:1px}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:14px;line-height:1.45}
.banner u{color:var(--leaf);text-decoration:none;font-weight:600}
.spinner{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp 800ms linear infinite;vertical-align:-4px;opacity:.8}
.empty .big .spinner{width:28px;height:28px}
.tip{background:var(--leafbg);border-radius:14px;padding:12px 14px;font-size:14px;color:#24502c}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var p=(s||today()).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((parse(a)-parse(b))/86400000);}
function nice(s){var n=diff(s,today());if(n===0)return "hoy";if(n===-1)return "ayer";if(n===1)return "mañana";if(n<0)return "hace "+(-n)+" días";if(n<7)return "en "+n+" días";return parse(s).toLocaleDateString("es",{day:"numeric",month:"short"});}
function short(s){return parse(s).toLocaleDateString("es",{day:"numeric",month:"short"});}
function uid(){return Math.random().toString(36).slice(2,9);}
function plant(id){for(var i=0;i<S.plants.length;i++)if(S.plants[i].id===id)return S.plants[i];return null;}
function plantLog(id){return S.log.filter(function(l){return l.plantId===id;}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(b.t||0)-(a.t||0);});}
function lastOf(id,kind){var l=plantLog(id).filter(function(x){return x.kind===kind;});return l[0]||null;}

/* tareas de cada planta */
function tasksFor(p){
  var out=[];
  if(p.type==="hidro"){
    var lm=lastOf(p.id,"medicion"), ls=lastOf(p.id,"solucion");
    out.push({kind:"medicion",label:"Medir pH y EC",due:addDays(lm?lm.d:p.created,p.check||3)});
    out.push({kind:"solucion",label:"Cambiar solución nutritiva",due:addDays(ls?ls.d:(p.lastSol||p.created),p.sol||14)});
  }else{
    var la=lastOf(p.id,"agua"), lf=lastOf(p.id,"abono");
    out.push({kind:"agua",label:"Regar",due:addDays(la?la.d:(p.lastWater||p.created),p.water||3)});
    out.push({kind:"abono",label:"Abonar",due:addDays(lf?lf.d:(p.lastFeed||p.created),p.feed||21)});
  }
  (p.reminders||[]).forEach(function(r){
    var l=plantLog(p.id).filter(function(x){return x.kind==="rem"&&x.remId===r.id;})[0];
    out.push({kind:"rem",remId:r.id,icon:r.icon||"🔔",label:r.label,due:addDays(l?l.d:(r.start||p.created),r.every)});
  });
  var tr=p.treatment;
  if(tr&&tr.active){
    tr.steps.forEach(function(st){if(!st.done)out.push({kind:"trat",stepId:st.id,icon:st.icon||"💊",label:st.action,due:addDays(tr.start,st.day),sev:tr.sev,prio:tr.priority});});
    var lph=photosOf(p).slice(-1)[0],base=lph&&lph.d>tr.start?lph.d:tr.start;
    out.push({kind:"control",icon:"📸",label:"Foto de control",due:addDays(base,tr.followup||5),sev:tr.sev,prio:tr.priority});
  }else{
    var li=plantLog(p.id).filter(function(l){return l.kind==="inspeccion"||l.kind==="foto"||l.kind==="salud";})[0];
    out.push({kind:"inspeccion",icon:"🔍",label:"Inspección preventiva",due:addDays(li?li.d:(p.created||today()),7)});
  }
  out.forEach(function(t){t.p=p;t.days=diff(t.due,today());});
  return out;
}
function prioOf(t){
  if(t.kind==="trat"||t.kind==="control")return (t.prio==="alta"||t.sev==="grave")?1:2;
  if((t.kind==="agua"||t.kind==="solucion")&&t.days<=-2)return 2;
  if(t.kind==="inspeccion")return 4;
  return 3;
}
function allTasks(){var a=[];S.plants.forEach(function(p){a=a.concat(tasksFor(p));});a.forEach(function(t){t.pr=prioOf(t);});return a.sort(function(x,y){return (x.days<=0&&y.days<=0)?(x.pr-y.pr||x.days-y.days):x.days-y.days;});}
function readingAlert(p){
  if(p.type!=="hidro")return null;
  var m=lastOf(p.id,"medicion"); if(!m)return null;
  var bad=[];
  if(m.ph!=null&&m.ph!==""){ if(m.ph<p.phMin)bad.push("pH bajo ("+m.ph+")"); if(m.ph>p.phMax)bad.push("pH alto ("+m.ph+")"); }
  if(m.ec!=null&&m.ec!==""){ if(m.ec<p.ecMin)bad.push("EC baja ("+m.ec+")"); if(m.ec>p.ecMax)bad.push("EC alta ("+m.ec+")"); }
  if(m.temp!=null&&m.temp!==""&&m.temp>24)bad.push("agua caliente ("+m.temp+" °C)");
  return bad.length?bad:null;
}
function lastHealth(p){
  return plantLog(p.id).filter(function(l){return (l.kind==="salud"||l.kind==="foto")&&l.sev;})[0]||null;
}
function healthOf(p){
  var h=lastHealth(p);
  if(h&&diff(today(),h.d)<=30&&h.sev!=="sana")return h;
  return null;
}

function timeline(p){

  return t.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.t||0)-(b.t||0);});
}

function addLog(entry){entry.id=uid();entry.t=Date.now();entry.d=entry.d||today();if(myEmail()&&!entry.by)entry.by=myEmail();S.log.push(entry);}
function doTask(pid,kind,remId){
  if(kind==="medicion"){openSheet({k:"medir",pid:pid});return;}
  if(kind==="trat"){
    var pt=plant(pid),tr=pt&&pt.treatment;if(!tr)return;
    var st=tr.steps.filter(function(x){return x.id===remId;})[0];if(!st)return;
    st.done=!st.done;st.doneOn=st.done?today():null;
    if(st.done)addLog({plantId:pid,kind:"nota",text:"Tratamiento: "+st.action});
    var left=tr.steps.filter(function(x){return !x.done;}).length;
    showToast(st.done?(left?"✅ Paso hecho. Quedan "+left+".":"🎉 Terminaste todos los pasos. Toma una foto de control para confirmar que mejoró."):"Paso marcado como pendiente.");
    save();render();return;
  }
  var dup=S.log.filter(function(l){return l.plantId===pid&&l.kind===kind&&(l.remId||null)===(remId||null)&&l.d===today();})[0];
  if(dup){var p0=plant(pid),n0=tasksFor(p0).filter(function(t){return t.kind===kind&&(t.remId||null)===(remId||null);})[0];showToast("👍 Ya estaba anotado hoy. Próximo: "+(n0?nice(n0.due):"—")+".");render();return;}
  var e={plantId:pid,kind:kind}; if(remId)e.remId=remId;
  addLog(e);
  var p=plant(pid),nt=tasksFor(p).filter(function(t){return t.kind===kind&&(t.remId||null)===(remId||null);})[0];
  var what={agua:"Riego",abono:"Abono",solucion:"Cambio de solución",inspeccion:"Inspección",rem:nt?nt.label:"Tarea"}[kind]||"Tarea";
  showToast("✅ "+what+" de "+p.name+" anotado. Próximo: "+(nt?nice(nt.due):"—")+".",e.id);
  save();render();
}

function spark(vals,min,max,color){
  if(vals.length<2)return "";
  var lo=Math.min.apply(null,vals.concat([min])),hi=Math.max.apply(null,vals.concat([max]));if(hi===lo)hi=lo+1;
  var W=300,H=56,pd=6;
  function y(v){return pd+(H-2*pd)*(1-(v-lo)/(hi-lo));}
  var pts=vals.map(function(v,i){return (pd+i*(W-2*pd)/(vals.length-1)).toFixed(1)+","+y(v).toFixed(1);}).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><rect x="0" y="'+y(max)+'" width="'+W+'" height="'+Math.max(2,y(min)-y(max))+'" fill="#e4efe0"/><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}

  });

function fixTip(al){
  var s=al.join(" ");
  var t=[];
  if(/pH alto/.test(s))t.push("Agrega unas gotas de pH Down y mide de nuevo en 15 min");
  if(/pH bajo/.test(s))t.push("Agrega unas gotas de pH Up y mide de nuevo en 15 min");
  if(/EC alta/.test(s))t.push("Agrega agua limpia para diluir");
  if(/EC baja/.test(s))t.push("Agrega nutriente poco a poco");
  if(/caliente/.test(s))t.push("Pon el depósito a la sombra u oxigena el agua");
  return esc(t.join(". "))+".";
}

function geoName(lat,lon){
  return fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=es")
    .then(function(r){return r.json();}).then(function(j){var a=[j.locality||j.city,j.principalSubdivision].filter(Boolean);return a.join(", ")||(lat.toFixed(3)+", "+lon.toFixed(3));})
    .catch(function(){return lat.toFixed(3)+", "+lon.toFixed(3);});
}

var REC_KEYS=[[/jab[oó]n/i,"jabon"],[/neem/i,"neem"],[/bicarbonato/i,"bicarbonato"],[/leche/i,"leche"],[/chorro|a presi[oó]n/i,"agua"],[/tijera|poda/i,"poda"],[/trampa/i,"trampas"],[/canela/i,"canela"]];
function recFor(text){for(var i=0;i<REC_KEYS.length;i++)if(REC_KEYS[i][0].test(text||""))return REC_KEYS[i][1];return null;}
/* ---- Lugares (se guardan como registros kind "lugar" para que se sincronicen) ---- */
function places(){return S.log.filter(function(l){return l.kind==="lugar";}).sort(function(a,b){return (a.t||0)-(b.t||0);});}
function placeById(id){return places().filter(function(x){return x.id===id;})[0]||null;}
function isTree(p){var c=catOf(p);return c==="Frutales"||c==="Árboles y arbustos";}
function canHarvest(p){var c=catOf(p);return c==="Frutales"||c==="Hortalizas"||c==="Aromáticas";}
function plantOut(p){if(p&&p.exp)return p.exp==="out";var pl=placeOf(p);return !!(pl&&pl.out);}
function placeOf(p){return p&&p.placeId?placeById(p.placeId):null;}
function placeLabel(p){var pl=placeOf(p);return pl?(pl.name+(p.place?" · "+p.place:"")):(p&&p.place)||"";}
function placeCtx(p){var pl=placeOf(p);if(!pl)return p.place||"";return pl.name+(pl.area?" ("+pl.area+", Costa Rica)":"")+(plantOut(p)?", al aire libre":", bajo techo")+(p.place?", "+p.place:"");}
/* ---- Clima por lugar: Open-Meteo, gratis y sin clave; se guarda 1 vez al día ---- */
var WX={};
function wxFor(pl){
  if(!pl||pl.lat==null)return null;
  var k="mj.wx."+pl.id+"."+today();
  if(WX[k])return WX[k].d||null;
  try{var c=localStorage.getItem(k);if(c){WX[k]={d:JSON.parse(c)};return WX[k].d;}}catch(e){}
  WX[k]={d:null};
  if(!navigator.onLine)return null;
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+pl.lat+"&longitude="+pl.lon+"&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min&timezone=America%2FCosta_Rica&forecast_days=3")
    .then(function(r){return r.json();}).then(function(j){
      var d=j&&j.daily;if(!d)return;
      var o={rain:d.precipitation_sum,prob:d.precipitation_probability_max,tmax:d.temperature_2m_max,tmin:d.temperature_2m_min};
      WX[k]={d:o};try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}softRender();
    }).catch(function(){});
  return null;
}
function rainsToday(pl){var w=wxFor(pl);return !!(w&&((w.rain[0]||0)>=5||(w.prob[0]||0)>=70));}
function wxLine(pl){
  var w=wxFor(pl);if(!w)return "";
  var r0=w.rain[0]||0,p0=w.prob[0]||0,r1=w.rain[1]||0;
  var ic=r0>=5||p0>=70?"🌧️":r0>=1||p0>=40?"🌦️":"☀️";
  var nOut=S.plants.filter(function(p){return p.placeId===pl.id&&plantOut(p);}).length;
  var tip=r0>=5||p0>=70?(nOut?"Lloverá: "+(nOut===1?"la planta al aire libre no necesita":"las "+nOut+" plantas al aire libre no necesitan")+" riego hoy.":"Día lluvioso: ventila las de adentro para evitar hongos."):((w.tmax[0]||0)>=31?"Mucho calor: revisa la tierra en la tarde.":r1>=5?"Mañana llueve.":"");
  return '<div class="wx"><span style="font-size:24px">'+ic+'</span><span style="flex:1"><b>'+esc(pl.name)+(pl.area?' · '+esc(pl.area):'')+'</b><br>Hoy '+Math.round(w.tmin[0])+'–'+Math.round(w.tmax[0])+' °C · lluvia '+(Math.round(r0*10)/10)+' mm ('+p0+' %)'+(tip?'<br>'+esc(tip):'')+'</span></div>';
}

    p.prop={methods:(r.methods||[]).slice(0,3).map(function(m){return {name:String(m.name||"Método"),difficulty:String(m.difficulty||""),when:String(m.when||""),time:String(m.time||""),steps:(m.steps||[]).map(String).slice(0,8)};}),graft:{possible:!!(r.graft&&r.graft.possible),rootstock:String((r.graft&&r.graft.rootstock)||""),note:String((r.graft&&r.graft.note)||""),steps:((r.graft&&r.graft.steps)||[]).map(String).slice(0,8)},tip:String(r.tip||"")};

function readForm(){
  var f=ui.form;

  if(v("f-resp")!==undefined)f.resp=v("f-resp")||null;
  if(v("f-notes")!==undefined)f.notes=v("f-notes");
  if(v("f-cat")!==undefined)f.category=v("f-cat");

if(["hoy","plantas","hidro","salud"].indexOf(h0)>=0)ui.tab=h0;

function boot(){
  function legacy(){
    var s=null;
    try{var l=localStorage.getItem(LS_KEY);if(l)s=JSON.parse(l);}catch(e){}
    try{var el=document.getElementById("state");if(el){var e2=JSON.parse(el.textContent);if(!s||(e2.v||0)>(s.v||0))s=e2;}}catch(e){}
    return s&&s.plants&&s.plants.length?s:null;
  }

  }).catch(function(e){ui.loading=false;render();showToast("⚠️ No pude abrir los datos guardados ("+((e&&e.message)||"error")+").",null,9000);});
  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
}
boot();
})();
